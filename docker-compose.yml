version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: depo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: depo_user
      POSTGRES_PASSWORD: depo_sifre_123
      POSTGRES_DB: depo_db
    volumes:
      - depo_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: depo_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://depo_user:depo_sifre_123@db:5432/depo_db
    ports:
      - "8080:8080"

volumes:
  depo_pgdata:
