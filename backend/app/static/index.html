<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depo Yönetim Sistemi</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>📦 Depo Yönetimi</h1>
  </header>

  <main>
    <section class="kart">
      <h2>Ürün Sorgula</h2>
      <div class="satir">
        <input type="text" id="barkodGirisi" placeholder="Barkod / ürün kodu" autofocus>
        <button onclick="urunSorgula()">Sorgula</button>
      </div>
      <div id="urunSonuc" class="sonuc-kutu" style="display:none;"></div>
    </section>

    <section class="kart" id="hareketKarti" style="display:none;">
      <h2>Stok Giriş / Çıkış</h2>
      <div class="satir">
        <input type="number" id="hareketMiktar" placeholder="Miktar" min="0" step="0.01">
        <button class="giris-btn" onclick="hareketYap('giris')">➕ Giriş</button>
        <button class="cikis-btn" onclick="hareketYap('cikis')">➖ Çıkış</button>
      </div>
      <input type="text" id="hareketNot" placeholder="Not (opsiyonel)">
    </section>

    <section class="kart">
      <h2>Yeni Ürün Ekle</h2>
      <div class="form-grid">
        <input type="text" id="yeniBarkod" placeholder="Barkod">
        <input type="text" id="yeniAd" placeholder="Ürün adı">
        <input type="text" id="yeniBirim" placeholder="Birim (adet, kutu...)" value="adet">
        <input type="number" id="yeniMiktar" placeholder="Başlangıç miktarı" value="0">
      </div>
      <button onclick="urunEkle()">Ürün Ekle</button>
      <div id="ekleSonuc"></div>
    </section>

    <section class="kart">
      <h2>Tüm Ürünler</h2>
      <button onclick="urunleriListele()">🔄 Listeyi Yenile</button>
      <table id="urunTablosu">
        <thead>
          <tr><th>Barkod</th><th>Ürün</th><th>Miktar</th><th>Birim</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="kart">
      <h2>Son Hareketler</h2>
      <button onclick="hareketleriListele()">🔄 Listeyi Yenile</button>
      <table id="hareketTablosu">
        <thead>
          <tr><th>Tarih</th><th>Tip</th><th>Miktar</th><th>Not</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
